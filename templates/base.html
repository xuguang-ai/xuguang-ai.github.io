<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ profile.name }}{% endblock %}</title>
<meta name="description" content="{{ profile.description }}">
<link rel="canonical" href="{{ site_url }}{{ path }}">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="{{ profile.name }}">
<meta property="og:title" content="{{ profile.name }}: {{ profile.role }}, {{ profile.affiliation }}">
<meta property="og:description" content="{{ profile.description }}">
<meta property="og:url" content="{{ site_url }}{{ path }}">
<meta property="og:image" content="{{ site_url }}/static/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="{{ asset('css/site.css') }}">
<script>document.documentElement.classList.add("js");</script>
<script type="application/ld+json">{{ person_jsonld|safe }}</script>
</head>
<body>
{% include "partials/icons.html" %}
{% include "partials/nav.html" %}
{% block content %}{% endblock %}
<script src="{{ asset('js/site.js') }}" defer></script>
{% if profile.get("goatcounter") %}
<script data-goatcounter="https://{{ profile.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{% endif %}
</body>
</html>
