headline_html: I build and evaluate AI for medicine and healthcare.
lede_html: >-
  I'm <strong>Xuguang Ai</strong>, a data scientist at Regenstrief Institute. I extract information from
  clinical text, build and evaluate foundation models and AI agents for medicine, apply AI to eye care, and
  link where patients live to what they are exposed to.

about_html:
  - >-
    I'm a <strong>data scientist at Regenstrief Institute</strong> in Indianapolis working with
    <a href="https://medicine.iu.edu/faculty/69099/bian-jiang">Jiang Bian</a>. Before that I was a data
    scientist in Biomedical Informatics &amp; Data Science at Yale School of Medicine, where I worked with <a href="https://medicine.yale.edu/profile/qingyu-chen/">Qingyu Chen</a> and
    <a href="https://medicine.yale.edu/profile/hua-xu/">Hua Xu</a> on language models for medicine.
  - >-
    I trained first in physics, then in data science at the University of Kentucky, where
    <a href="https://engr.uky.edu/people/ramakanth-kavuluru">Ramakanth Kavuluru</a> advised my work on
    biomedical information extraction.

