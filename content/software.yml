# Open-source projects, in display order. `install` shows a copyable command. With an odd number of
# projects the first card spans the full width.
- name: SPACESCANS
  repo: IU-Ultraman/spacescans
  href: https://github.com/IU-Ultraman/spacescans
  description: >-
    Links time-referenced geolocation data to the spatial and contextual exposome: an ontology-organized
    exposure catalog, user-supplied datasets, cached spatial weights, and day-weighted participant-level
    estimates.
  install: pip install spacescans
  langs: [Python, R, Web app]
  links:
    - label: PyPI
      href: https://pypi.org/project/spacescans/
    - label: spacescans.com
      href: https://spacescans.com

- name: End-to-end ChemProt
  repo: xuguang-ai/end-to-end-ChemProt
  href: https://github.com/xuguang-ai/end-to-end-ChemProt
  description: >-
    Span-based end-to-end chemical–protein relation extraction with finer-grained tokenization. Code for the
    IEEE ICHI 2023 paper.
  langs: [Python]

- name: TokenBar
  repo: xuguang-ai/TokenBar
  href: https://github.com/xuguang-ai/TokenBar
  description: >-
    Claude Code and Codex usage limits in the macOS menu bar: five-hour, weekly and per-model limits across
    accounts, plus the agents currently running.
  langs: [Swift, macOS]
